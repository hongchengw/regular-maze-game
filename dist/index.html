body {

/* The canvas fills the viewport; the renderer handles devicePixelRatio itself. */
#canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #000;
}

/* The jumpscare overlay. No animation, no transition, no keyframes, ever. */
.jumpscare {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  z-index: 9999;
}

.jumpscare.visible {
  display: block;
}

.jumpscare img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}</style>
