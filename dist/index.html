<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Maze</title>
    <style>html,
body {
  margin: 0;
  background: #000;
  height: 100%;
  overflow: hidden;
}

/* The canvas fills the viewport; the renderer handles devicePixelRatio itself. */
#canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #000;
}

/* The D-pad: a 3x3 grid with the four buttons in the cross positions, fixed bottom-centre.
   Shown only while playing, and only where a coarse pointer is present. */
.dpad {
  display: none;
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom));
  grid-template-columns: repeat(3, 64px);
  grid-template-rows: repeat(3, 64px);
  gap: 6px;
  user-select: none;
  z-index: 10;
}

@media (pointer: coarse) {
  body[data-phase='playing'] .dpad {
    display: grid;
  }
}

.dpad button {
  min-width: 56px;
  min-height: 56px;
  border: 1px solid #444;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

.dpad button:active {
  background: rgba(255, 255, 255, 0.2);
}

.dpad-up {
  grid-area: 1 / 2;
}
.dpad-left {
  grid-area: 2 / 1;
}
.dpad-right {
  grid-area: 2 / 3;
}
.dpad-down {
  grid-area: 3 / 2;
}

/* The jumpscare overlay. No animation, no transition, no keyframes, ever. */
.jumpscare {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  z-index: 9999;
}

.jumpscare.visible {
  display: block;
}

.jumpscare img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* While the scare is up nothing else exists: no cursor, no D-pad, no canvas, no text. Every other
   element is hidden rather than merely covered. */
body[data-phase='scare'] {
  cursor: none;
}

body[data-phase='scare'] #screens,
body[data-phase='scare'] .dpad {
  display: none;
}</style>
  </head>
  <body data-phase="title">
    <div class="dpad" id="dpad">
      <button class="dpad-up" data-code="dpad-up" aria-label="Move up"></button>
      <button class="dpad-left" data-code="dpad-left" aria-label="Move left"></button>
      <button class="dpad-right" data-code="dpad-right" aria-label="Move right"></button>
      <button class="dpad-down" data-code="dpad-down" aria-label="Move down"></button>
    </div>

    <div class="jumpscare" id="jumpscare"><img alt="" /></div>

const JUMPSCARE_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR42mPgIhEwjGoY1TB8NQAA9bMeAeVRnTAAAAAASUVORK5CYII=";

  </body>
</html>
