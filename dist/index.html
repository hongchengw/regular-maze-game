    <style>html,
body {
  margin: 0;
  background: #000;
  height: 100%;
  overflow: hidden;
  /* Pull-to-refresh and scroll chaining must not fire mid-glide on a phone. */
  overscroll-behavior: none;
  touch-action: none;
  -webkit-text-size-adjust: 100%;
}

/* The canvas fills the viewport; the renderer handles devicePixelRatio itself.
   `dvh` tracks a mobile browser's sliding address bar, which `vh` does not. */
#canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  background: #000;
  touch-action: none;
}

/* One screen per phase, driven entirely by the data-phase attribute on body. No imperative
   show/hide anywhere in the code. */
[data-screen] {
  display: none;
}

body[data-phase='title'] [data-screen='title'],
body[data-phase='levelup'] [data-screen='levelup'],
body[data-phase='playing'] [data-screen='playing'] {
  display: flex;
}

[data-screen='title'],
[data-screen='levelup'] {
  position: fixed;
  inset: 0;
  height: 100dvh;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 24px;
  padding: 0 24px calc(18vh + env(safe-area-inset-bottom));
  box-sizing: border-box;
  font-family: system-ui, sans-serif;
  color: #fff;
}

[data-screen='levelup'] {
  justify-content: center;
}

/* The level-up beat: one line of text on black, matched to the buttons so it reads as the same
   app rather than as an interstitial. It is a beat, not a screen the player acts on. */
.levelup {
  margin: 0;
  font-size: 16px;
  letter-spacing: 0.18em;
}

/* The warning is the user's only forewarning. It reads before the button, so it comes first in the
   DOM as well as above it on screen. */
.warning {
  margin: 0;
  max-width: 34ch;
  text-align: center;
  font-size: 15px;
  line-height: 1.5;
}

#screens button {
  min-width: 180px;
  min-height: 56px;
  padding: 0 24px;
  border: 1px solid #fff;
  border-radius: 4px;
  background: transparent;
  color: #fff;
  font: inherit;
  font-size: 16px;
  letter-spacing: 0.18em;
  cursor: pointer;
}

#screens button:active {
  background: rgba(255, 255, 255, 0.15);
}

/* The D-pad: a 3x3 grid with the four buttons in the cross positions, fixed bottom-centre.
   Shown only while playing, and only where a coarse pointer is present. */
.dpad {
  display: none;
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom));
  grid-template-columns: repeat(3, 64px);
  grid-template-rows: repeat(3, 64px);
  gap: 6px;
  user-select: none;
  z-index: 10;
}

@media (pointer: coarse) {
  body[data-phase='playing'] .dpad {
    display: grid;
  }
}

.dpad button {
  min-width: 56px;
  min-height: 56px;
  border: 1px solid #444;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  /* A long press must not raise the iOS callout or a selection while a direction is held. */
  -webkit-touch-callout: none;
  user-select: none;
}

.dpad button:active {
  background: rgba(255, 255, 255, 0.2);
}

.dpad-up {
  grid-area: 1 / 2;
}
.dpad-left {
  grid-area: 2 / 1;
}
.dpad-right {
  grid-area: 2 / 3;
}
.dpad-down {
  grid-area: 3 / 2;
}

/* The jumpscare overlay. No animation, no transition, no keyframes, ever. */
.jumpscare {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  z-index: 9999;
}

.jumpscare.visible {
  display: block;
}

.jumpscare img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* While the scare is up nothing else exists: no cursor, no D-pad, no canvas, no text. Every other
   element is hidden rather than merely covered. */
body[data-phase='scare'] {
  cursor: none;
}

body[data-phase='scare'] #screens,
body[data-phase='scare'] .dpad {
  display: none;
}</style>

  <body data-phase="title">
    <div id="screens">
      <section data-screen="title">
        <p class="warning">WARNING: Not suitable for those sensitive to sudden sounds or visuals.</p>
        <button id="start">START</button>
      </section>
      <section data-screen="levelup">
        <p class="levelup" id="levelup"></p>
      </section>
      <section data-screen="playing">
        <canvas id="canvas"></canvas>
      </section>
    </div>

    <div class="dpad" id="dpad">
      <button type="button" class="dpad-up" data-code="dpad-up" aria-label="Move up"></button>
      <button type="button" class="dpad-left" data-code="dpad-left" aria-label="Move left"></button>
      <button type="button" class="dpad-right" data-code="dpad-right" aria-label="Move right"></button>
      <button type="button" class="dpad-down" data-code="dpad-down" aria-label="Move down"></button>
    </div>

// The one tuning table. Every tunable number in the game lives here and nowhere else.
//
// Harder means a larger grid, a fatter blob relative to the corridor, and a smaller fog radius, so
// more of the maze is navigated blind. Because the renderer fits the whole maze to the viewport, a
// larger grid also means fewer pixels per cell, which tightens HARD corridors visually without
// touching the cell-unit geometry.

const DIFFICULTY = Object.freeze({
  EASY: Object.freeze({
    cols: 10,
    rows: 10,
    blobRadius: 0.16,
    wallHalfThickness: 0.04,
    fogRadius: 2.4,
    speed: 3.2,
    exitRadius: 0.3,
  }),
  MEDIUM: Object.freeze({
    cols: 16,
    rows: 16,
    blobRadius: 0.18,
    wallHalfThickness: 0.035,
    fogRadius: 1.8,
    speed: 3.4,
    exitRadius: 0.28,
  }),
  HARD: Object.freeze({
    cols: 24,
    rows: 24,
    blobRadius: 0.22,
    wallHalfThickness: 0.03,
    fogRadius: 1.3,
    speed: 3.6,
    exitRadius: 0.25,
  }),
});

/** Display order for the select screen, so the UI cannot drift from the table. */
const LEVELS = Object.freeze(['EASY', 'MEDIUM', 'HARD']);

/** Slack between the blob's edge and a wall when the blob is centred in a corridor. */
function clearance(level) {
  return 0.5 - (level.blobRadius + level.wallHalfThickness);
}

// Seeded pseudo-random float stream. Kept exactly as mulberry32 is published so the same seed
// yields the same maze across Node versions and browsers.

/** Returns a function producing floats in [0, 1), deterministic for a given `seed`. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Seeded perfect maze generation and its wall geometry, in cell units.
//
// A maze is `{ cols, rows, passages }` where `passages` is a Set of canonical keys naming the two
// cells a carved passage joins. A perfect maze is a spanning tree, so `passages.size` is always
// `cols * rows - 1`: exactly one path between any two cells, no loops, no isolated cells.

/** The four orthogonal neighbour offsets, in screen order: up, right, down, left. */
const MAZE_NEIGHBOURS = [
  [0, -1],
  [1, 0],
  [0, 1],
  [-1, 0],
];

/** Canonical key for the boundary between two adjacent cells, smaller cell first. */
function passageKey(c1, r1, c2, r2) {
  const a = `${c1},${r1}`;
  const b = `${c2},${r2}`;
  return a < b ? `${a}|${b}` : `${b}|${a}`;
}

/** True if a passage has been carved between two adjacent cells. */
function isCarved(maze, c1, r1, c2, r2) {
  return maze.passages.has(passageKey(c1, r1, c2, r2));
}

/** In-place Fisher-Yates shuffle driven by the seeded `rng`. */
function shuffle(items, rng) {
  for (let i = items.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

/**
 * Carve a perfect maze with a recursive backtracker, using an explicit stack so a large grid
 * cannot overflow the call stack. `rng` is the seed policy's business, not this function's.
 */
function generate(cols, rows, rng) {
  if (!Number.isInteger(cols) || !Number.isInteger(rows) || cols < 1 || rows < 1) {
    throw new Error(`Invalid maze size ${cols}x${rows}: cols and rows must be integers >= 1`);
  }

  const passages = new Set();
  const visited = new Set(['0,0']);
  const stack = [[0, 0]];

  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const options = shuffle([...MAZE_NEIGHBOURS], rng)
      .map(([dc, dr]) => [c + dc, r + dr])
      .filter(([nc, nr]) => nc >= 0 && nr >= 0 && nc < cols && nr < rows)
      .filter(([nc, nr]) => !visited.has(`${nc},${nr}`));

    if (!options.length) {
      stack.pop();
      continue;
    }

    const [nc, nr] = options[0];
    passages.add(passageKey(c, r, nc, nr));
    visited.add(`${nc},${nr}`);
    stack.push([nc, nr]);
  }

  return { cols, rows, passages };
}

/**
 * Flatten a maze into wall line segments on cell boundaries. Each boundary is emitted at most once:
 * a cell contributes its top and left edges, and the last column and row close the outer border.
 */
function toSegments(maze) {
  const { cols, rows } = maze;
  const segments = [];

  for (let r = 0; r < rows; r += 1) {
    for (let c = 0; c < cols; c += 1) {
      if (r === 0 || !isCarved(maze, c, r, c, r - 1)) {
        segments.push({ x1: c, y1: r, x2: c + 1, y2: r });
      }
      if (c === 0 || !isCarved(maze, c, r, c - 1, r)) {
        segments.push({ x1: c, y1: r, x2: c, y2: r + 1 });
      }
    }
  }

  for (let r = 0; r < rows; r += 1) {
    segments.push({ x1: cols, y1: r, x2: cols, y2: r + 1 });
  }
  for (let c = 0; c < cols; c += 1) {
    segments.push({ x1: c, y1: rows, x2: c + 1, y2: rows });
  }

  return segments;
}

/**
 * Breadth-first path from the start cell (0,0) to the exit cell (cols-1, rows-1) across carved
 * passages. Serves tests, not gameplay.
 */
function solve(maze) {
  const { cols, rows } = maze;
  const parents = new Map([['0,0', null]]);
  const queue = [[0, 0]];
  const goal = `${cols - 1},${rows - 1}`;

  for (let head = 0; head < queue.length; head += 1) {
    const [c, r] = queue[head];
    if (`${c},${r}` === goal) break;

    for (const [dc, dr] of MAZE_NEIGHBOURS) {
      const nc = c + dc;
      const nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
      if (parents.has(`${nc},${nr}`) || !isCarved(maze, c, r, nc, nr)) continue;
      parents.set(`${nc},${nr}`, `${c},${r}`);
      queue.push([nc, nr]);
    }
  }

  const path = [];
  for (let at = goal; at !== null && at !== undefined; at = parents.get(at)) {
    const [c, r] = at.split(',').map(Number);
    path.unshift({ c, r });
  }
  return path;
}

// Swept circle collision against wall segments, in cell units.
//
// Contact is strictly closer than `radius + halfThickness`, so exactly touching is not a hit and
// the boundary case goes to the player. Collision never slides and never bounces; the game layer
// decides what a hit costs.
//
// Broad-phase acceleration is deliberately out of scope: a 24x24 maze has under 1200 segments and
// this runs once per frame.

/** Squared distance from a point to a segment, with the projection clamped to the segment. */
function distanceSquaredPointSegment(px, py, seg) {
  const dx = seg.x2 - seg.x1;
  const dy = seg.y2 - seg.y1;
  const lengthSquared = dx * dx + dy * dy;

  // A zero-length segment degrades to plain point distance rather than dividing by zero.
  const projection =
    lengthSquared === 0 ? 0 : ((px - seg.x1) * dx + (py - seg.y1) * dy) / lengthSquared;
  const t = Math.max(0, Math.min(1, projection));

  const nearestX = seg.x1 + t * dx;
  const nearestY = seg.y1 + t * dy;
  return (px - nearestX) ** 2 + (py - nearestY) ** 2;
}

/** Distance from a point to a wall segment. Never returns NaN. */
function distancePointSegment(px, py, seg) {
  return Math.sqrt(distanceSquaredPointSegment(px, py, seg));
}

/** True if a blob of `radius` centred at (x, y) is in contact with any segment. */
function hitsWall(x, y, radius, segments, halfThickness) {
  const contact = radius + halfThickness;
  const contactSquared = contact * contact;

  for (const seg of segments) {
    if (distanceSquaredPointSegment(x, y, seg) < contactSquared) return true;
  }
  return false;
}

/**
 * Move a blob from `from` to `to` in sub-steps no longer than `radius / 2`, testing each one, so no
 * frame delta or flick speed can tunnel a wall. Returns the first contact along with the last
 * position that was itself clear.
 */
function sweep(from, to, radius, segments, halfThickness) {
  if (hitsWall(from.x, from.y, radius, segments, halfThickness)) {
    return { hit: true, pos: { x: from.x, y: from.y }, steps: 0 };
  }

  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const distance = Math.hypot(dx, dy);

  if (distance === 0) {
    return { hit: false, pos: { x: from.x, y: from.y }, steps: 0 };
  }

  const steps = Math.max(1, Math.ceil(distance / (radius / 2)));
  let safe = { x: from.x, y: from.y };

  for (let i = 1; i <= steps; i += 1) {
    const t = i / steps;
    const x = from.x + dx * t;
    const y = from.y + dy * t;

    if (hitsWall(x, y, radius, segments, halfThickness)) {
      return { hit: true, pos: safe, steps: i };
    }
    safe = { x, y };
  }

  return { hit: false, pos: safe, steps };
}

// The whole game as pure functions over a plain state object: phases, movement, wall contact, and
// exit detection.
//
// Nothing here knows about the DOM, the canvas, audio, or the clock. It receives `dt` and an input
// vector and returns the next state, which is what makes the game testable in plain Node.






/** Seconds. Caps a frame delta so a background tab regaining focus cannot jump the maze. */
const MAX_DT = 0.05;

/** Seconds the `LEVEL n OF 3` beat holds between two levels. */
const LEVELUP_DURATION = 1;

/** Seconds the jumpscare image holds before the app returns to the title screen. */
const SCARE_DURATION = 6;

/** The initial state. Also the state the app returns to after a scare. */
function createGame() {
  return {
    phase: 'title',
    levelName: null,
    level: null,
    levelIndex: 0,
    seed: null,
    maze: null,
    segments: null,
    pos: null,
    start: null,
    exit: null,
    hits: 0,
    levelupElapsed: 0,
    scareElapsed: 0,
  };
}

/**
 * Title straight into the first level. There is nothing to choose: the three levels are played in
 * `LEVELS` order, every time.
 */
function pressStart(state, seed) {
  return startLevel(state, LEVELS[0], seed);
}

/** Playing: carve a maze from `seed` and place the blob in the centre of cell (0,0). */
function startLevel(state, levelName, seed) {
  // Own properties only. `__proto__`, `constructor`, and friends all return something truthy from a
  // plain object, so a bare lookup would pass this guard and fail later with a confusing error.
  const known = Object.prototype.hasOwnProperty.call(DIFFICULTY, levelName);
  if (!known) throw new Error(`Unknown level '${levelName}'`);

  const level = DIFFICULTY[levelName];

  const maze = generate(level.cols, level.rows, mulberry32(seed));
  const start = { x: 0.5, y: 0.5 };

  return {
    ...state,
    phase: 'playing',
    levelName,
    level,
    levelIndex: LEVELS.indexOf(levelName),
    seed,
    maze,
    segments: toSegments(maze),
    pos: { ...start },
    start,
    exit: { x: level.cols - 0.5, y: level.rows - 0.5 },
    hits: 0,
    levelupElapsed: 0,
    scareElapsed: 0,
  };
}

/**
 * The next level's seed, derived from the current one rather than drawn from the clock or a global
 * random source. Keeping the derivation pure is what leaves this module with no dependency on either
 * of those, and it is what lets a whole three-level run be replayed from a single starting seed.
 */
function deriveSeed(seed) {
  return Math.floor(mulberry32(seed)() * 2 ** 32);
}

/** Normalize an input vector longer than 1, so the blob's speed is equal in all eight directions. */
function direction(input) {
  const length = Math.hypot(input.dx, input.dy);
  if (length === 0) return { dx: 0, dy: 0 };
  return length > 1 ? { dx: input.dx / length, dy: input.dy / length } : { dx: input.dx, dy: input.dy };
}

/** One frame of playing: glide one axis at a time, then test the exit on where the blob ended up. */
function stepPlaying(state, dt, input) {
  const { level, pos, segments } = state;
  const dir = direction(input);
  const vx = dir.dx * level.speed * dt;
  const vy = dir.dy * level.speed * dt;

  // Each axis is swept on its own, x first, so a wall blocks only the axis pressed into it and the
  // blob slides along it. `sweep` returns the last clear position, which is exactly the
  // blocked-but-not-teleported position this wants. Contact costs momentum and nothing else: the
  // maze, the seed, and the position are all untouched, so the player keeps their mental map.
  //
  // Resolving x before y biases a diagonal into a corner by well under a pixel at these speeds, so
  // there is no second pass to even it out.
  const r = level.blobRadius;
  const halfThickness = level.wallHalfThickness;
  const slidX = sweep(pos, { x: pos.x + vx, y: pos.y }, r, segments, halfThickness);
  const slidY = sweep(slidX.pos, { x: slidX.pos.x, y: slidX.pos.y + vy }, r, segments, halfThickness);

  const moved = slidY.pos;
  const hits = state.hits + (slidX.hit || slidY.hit ? 1 : 0);
  const reached = Math.hypot(moved.x - state.exit.x, moved.y - state.exit.y) < level.exitRadius;

  if (!reached) return { ...state, pos: moved, hits };

  // The level ends the instant the exit is touched. Only the last level's exit fires the scare;
  // every earlier one hands over through the level-up beat.
  return state.levelIndex + 1 < LEVELS.length
    ? { ...state, pos: moved, hits, phase: 'levelup', levelupElapsed: 0 }
    : { ...state, pos: moved, hits, phase: 'scare', scareElapsed: 0 };
}

/**
 * Advance the game by `dt` seconds under `input` = `{ dx, dy }`. Returns a new state and never
 * mutates its argument. Input is ignored in every phase except `playing`.
 */
function step(state, dt, input) {
  const clamped = Math.min(dt, MAX_DT);

  if (state.phase === 'playing') return stepPlaying(state, clamped, input);

  if (state.phase === 'levelup') {
    const levelupElapsed = state.levelupElapsed + clamped;
    if (levelupElapsed < LEVELUP_DURATION) return { ...state, levelupElapsed };
    return startLevel(state, LEVELS[state.levelIndex + 1], deriveSeed(state.seed));
  }

  if (state.phase === 'scare') {
    const scareElapsed = state.scareElapsed + clamped;
    // Discarding everything is structural: the app returns to a state identical to a fresh game.
    return scareElapsed >= SCARE_DURATION ? createGame() : { ...state, scareElapsed };
  }

  return state;
}

// Canvas drawing: white maze lines on black, revealed only inside a soft fog disc around the blob.
//
// This module owns the single cell-units-to-pixels transform, so a resize recomputes `scale` and
// nothing else. Drawing is a pure function of state plus canvas size and never mutates game state.

/** Fraction of the shorter viewport axis the maze fills, leaving a margin. */
const FIT = 0.92;

/**
 * Ceiling on the canvas backing store's pixel ratio. A phone reporting 3 would fill nine times the
 * pixels every frame for a difference no one can see on flat white lines over black.
 */
const MAX_DPR = 2;

/** Usable backing-store ratio: capped, and never zero or missing, which would render blank. */
function backingScale(dpr) {
  return Number.isFinite(dpr) && dpr > 1 ? Math.min(dpr, MAX_DPR) : 1;
}

/** Fraction of the fog radius that is fully clear before the edge starts fading. */
const FOG_CLEAR = 0.75;

/** How far the blob's glow reaches, as a multiple of the blob radius. */
const BLOB_HALO = 2;

/** Milliseconds for one full pulse of the exit marker. Slow on purpose: this is never a strobe. */
const PULSE_PERIOD = 1400;

/** Amber. Deliberately not wall white, so the marker cannot be read as a piece of maze. */
const EXIT_COLOR = '#ffb300';

/** Alpha the pulse drives between. The low end stays well clear of zero: the marker never blinks out. */
const EXIT_ALPHA_MIN = 0.55;
const EXIT_ALPHA_MAX = 1;

/** Marker radius the pulse drives between, as a multiple of the base radius. Both bounds stay narrow. */
const EXIT_SCALE_MIN = 0.9;
const EXIT_SCALE_MAX = 1.15;

/** The pulse itself: 0 to 1 and back, once per `PULSE_PERIOD`, continuous everywhere. */
function exitPulse(timeMs) {
  return (Math.sin((timeMs / PULSE_PERIOD) * Math.PI * 2) + 1) / 2;
}

/**
 * True when the exit lies inside the fog disc. The marker is drawn only then, which is what keeps
 * the goal invisible from across the maze, and it is also what tells `draw` it cannot idle.
 */
function exitVisible(pos, exit, fogRadiusCells) {
  return Math.hypot(pos.x - exit.x, pos.y - exit.y) < fogRadiusCells;
}

/**
 * Fit a `cols` x `rows` maze into a viewport. Aspect independent: rotating the device yields the
 * same scale with the offsets swapped.
 */
function fitTransform(viewW, viewH, cols, rows) {
  const scale = (Math.min(viewW, viewH) * FIT) / Math.max(cols, rows);
  return {
    scale,
    offsetX: (viewW - cols * scale) / 2,
    offsetY: (viewH - rows * scale) / 2,
  };
}

/** Cell units to pixels. */
function toPixels(cx, cy, t) {
  return { x: t.offsetX + cx * t.scale, y: t.offsetY + cy * t.scale };
}

/** Pixels back to cell units. */
function toCells(px, py, t) {
  return { cx: (px - t.offsetX) / t.scale, cy: (py - t.offsetY) / t.scale };
}

/** Wall stroke width in pixels: exactly the geometry collision uses, so what you see is what you hit. */
function strokeWidthPx(level, scale) {
  return level.wallHalfThickness * 2 * scale;
}

/** Fog disc radius in pixels. */
function fogRadiusPx(level, scale) {
  return level.fogRadius * scale;
}

/** True if a segment's bounding box lies entirely outside the fog disc, so drawing it is wasted. */
function outsideFog(seg, cx, cy, radiusCells) {
  const minX = Math.min(seg.x1, seg.x2) - radiusCells;
  const maxX = Math.max(seg.x1, seg.x2) + radiusCells;
  const minY = Math.min(seg.y1, seg.y2) - radiusCells;
  const maxY = Math.max(seg.y1, seg.y2) + radiusCells;
  return cx < minX || cx > maxX || cy < minY || cy > maxY;
}

/**
 * Bind a renderer to a canvas. `resize()` recomputes the backing store and the transform; `draw`
 * paints one frame of `state`.
 */
function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');
  let viewW = 0;
  let viewH = 0;

  // Gradients are built once per radius and reused by translating the canvas to the blob, rather
  // than rebuilt every frame at a new centre. Both are the same shape wherever the blob is.
  let fogFade = null;
  let fogFadeRadius = 0;
  let blobHalo = null;
  let blobHaloRadius = 0;

  // Last drawn frame, so a frame that would change nothing can be skipped outright.
  let lastX = NaN;
  let lastY = NaN;
  let lastW = 0;
  let lastH = 0;

  function resize() {
    const dpr = backingScale(window.devicePixelRatio);
    viewW = canvas.clientWidth;
    viewH = canvas.clientHeight;
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lastX = NaN;
  }

  /** Transparent at the clear radius, opaque black at the edge. Centred on the origin. */
  function fadeFor(radius) {
    if (fogFade && fogFadeRadius === radius) return fogFade;
    fogFade = ctx.createRadialGradient(0, 0, radius * FOG_CLEAR, 0, 0, radius);
    fogFade.addColorStop(0, 'rgba(0, 0, 0, 0)');
    fogFade.addColorStop(1, 'rgba(0, 0, 0, 1)');
    fogFadeRadius = radius;
    return fogFade;
  }

  /** The blob's soft edge, replacing a per-frame `shadowBlur`. Centred on the origin. */
  function haloFor(radius) {
    if (blobHalo && blobHaloRadius === radius) return blobHalo;
    blobHalo = ctx.createRadialGradient(0, 0, radius * 0.5, 0, 0, radius * BLOB_HALO);
    blobHalo.addColorStop(0, 'rgba(255, 255, 255, 1)');
    blobHalo.addColorStop(0.5, 'rgba(255, 255, 255, 0.35)');
    blobHalo.addColorStop(1, 'rgba(255, 255, 255, 0)');
    blobHaloRadius = radius;
    return blobHalo;
  }

  function draw(state, timeMs) {
    if (state.phase !== 'playing') {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, viewW, viewH);
      lastX = NaN;
      return;
    }

    const { level, pos, segments } = state;
    const markerShowing = exitVisible(pos, state.exit, level.fogRadius);

    // Nothing moved, nothing resized, and the marker is not on screen, so the last frame is still
    // correct. The marker is the one exception: idling on it would freeze its pulse.
    if (
      pos.x === lastX &&
      pos.y === lastY &&
      viewW === lastW &&
      viewH === lastH &&
      !markerShowing
    ) {
      return;
    }
    lastX = pos.x;
    lastY = pos.y;
    lastW = viewW;
    lastH = viewH;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, viewW, viewH);

    const t = fitTransform(viewW, viewH, state.maze.cols, state.maze.rows);
    const blobX = t.offsetX + pos.x * t.scale;
    const blobY = t.offsetY + pos.y * t.scale;
    const fog = fogRadiusPx(level, t.scale);

    // Walls, clipped to the fog disc. Everything outside it stays the black already painted.
    ctx.save();
    ctx.beginPath();
    ctx.arc(blobX, blobY, fog, 0, Math.PI * 2);
    ctx.clip();

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = strokeWidthPx(level, t.scale);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const seg of segments) {
      if (outsideFog(seg, pos.x, pos.y, level.fogRadius)) continue;
      // Inline rather than via `toPixels`, to allocate nothing per segment per frame.
      ctx.moveTo(t.offsetX + seg.x1 * t.scale, t.offsetY + seg.y1 * t.scale);
      ctx.lineTo(t.offsetX + seg.x2 * t.scale, t.offsetY + seg.y2 * t.scale);
    }
    ctx.stroke();

    // The exit marker, drawn inside the fog clip and before the fade, so the fade dims it at the
    // edge of the disc exactly as it dims the walls. Drawn after the fade it would glow through the
    // darkness and give the goal away from across the maze.
    if (markerShowing) {
      const pulse = exitPulse(timeMs);
      const base = level.exitRadius * t.scale;

      ctx.globalAlpha = EXIT_ALPHA_MIN + pulse * (EXIT_ALPHA_MAX - EXIT_ALPHA_MIN);
      ctx.fillStyle = EXIT_COLOR;
      ctx.beginPath();
      ctx.arc(
        t.offsetX + state.exit.x * t.scale,
        t.offsetY + state.exit.y * t.scale,
        base * (EXIT_SCALE_MIN + pulse * (EXIT_SCALE_MAX - EXIT_SCALE_MIN)),
        0,
        Math.PI * 2,
      );
      ctx.fill();
    }

    // `restore` also puts `globalAlpha` back, so nothing after this inherits the pulse.
    ctx.restore();

    // Everything from here is drawn around the origin, with the canvas translated to the blob, so
    // the cached gradients stay valid wherever the blob is.
    ctx.save();
    ctx.translate(blobX, blobY);

    // Fade the outer quarter of the disc to black, so the fog edge is not a cookie cutter.
    ctx.fillStyle = fadeFor(fog);
    ctx.beginPath();
    ctx.arc(0, 0, fog, 0, Math.PI * 2);
    ctx.fill();

    // The blob. Nothing else is drawn: no HUD, no timer, and no hit counter. The exit marker above
    // is the only other thing on screen, and only from inside the fog.
    const blobRadius = level.blobRadius * t.scale;
    ctx.fillStyle = haloFor(blobRadius);
    ctx.beginPath();
    ctx.arc(0, 0, blobRadius * BLOB_HALO, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, blobRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  return { resize, draw };
}

// Held keys and held D-pad buttons reduced to one `{ dx, dy }` vector.
//
// Keyboard codes and D-pad ids share one map and one code path, so desktop and touch produce
// identical movement and there is only one behavior to reason about.
//
// The mouse is never used during gameplay. It clicks START and the difficulty buttons, nothing else.

const KEY_MAP = Object.freeze({
  KeyW: 'up',
  ArrowUp: 'up',
  'dpad-up': 'up',
  KeyS: 'down',
  ArrowDown: 'down',
  'dpad-down': 'down',
  KeyA: 'left',
  ArrowLeft: 'left',
  'dpad-left': 'left',
  KeyD: 'right',
  ArrowRight: 'right',
  'dpad-right': 'right',
});

/** True for the codes the game handles, so the listener knows exactly when to `preventDefault`. */
function isGameKey(code) {
  return Object.prototype.hasOwnProperty.call(KEY_MAP, code);
}

/**
 * True for the D-pad ids, which are the only codes a pointer can hold. A window-level pointer
 * release clears these and nothing else, so a mouse click anywhere on the page cannot stop a blob
 * being glided with the keyboard.
 */
function isPointerCode(code) {
  return isGameKey(code) && code.startsWith('dpad-');
}

/**
 * Reduce a Set of held codes to a raw direction vector. Opposites cancel and unknown codes are
 * ignored. The vector is left unnormalized on purpose: that is `game.step`'s job.
 */
function vectorFrom(heldCodes) {
  const dirs = { up: false, down: false, left: false, right: false };
  for (const code of heldCodes) {
    if (!isGameKey(code)) continue;
    dirs[KEY_MAP[code]] = true;
  }

  return {
    dx: (dirs.right ? 1 : 0) - (dirs.left ? 1 : 0),
    dy: (dirs.down ? 1 : 0) - (dirs.up ? 1 : 0),
  };
}

/**
 * Bind keyboard and D-pad listeners. Returns the current `vector()`, plus `clear()` for phase
 * changes, and `attach`/`detach` for the listeners themselves.
 */
function createInput(dpadElement) {
  const heldCodes = new Set();

  const onKeyDown = (event) => {
    if (!isGameKey(event.code)) return;
    event.preventDefault();
    heldCodes.add(event.code);
  };

  const onKeyUp = (event) => {
    if (!isGameKey(event.code)) return;
    event.preventDefault();
    heldCodes.delete(event.code);
  };

  const clear = () => heldCodes.clear();

  // A finger released outside a button's bounds would otherwise never clear its direction, leaving
  // the blob stuck moving, so pointer release is also watched on the window. It releases only the
  // D-pad: clearing everything here would mean a stray mouse click stopped a keyboard glide.
  const onPointerRelease = () => {
    for (const code of heldCodes) {
      if (isPointerCode(code)) heldCodes.delete(code);
    }
  };

  const buttons = dpadElement ? [...dpadElement.querySelectorAll('button[data-code]')] : [];
  const bound = buttons.map((button) => {
    const code = button.dataset.code;
    const press = (event) => {
      event.preventDefault();
      heldCodes.add(code);
    };
    const release = () => heldCodes.delete(code);
    return { button, press, release };
  });

  // A long press on a D-pad button would otherwise raise the context menu on mobile, which steals
  // the pointer and leaves the direction held.
  const onContextMenu = (event) => event.preventDefault();

  function attach() {
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', clear);
    document.addEventListener('visibilitychange', clear);
    window.addEventListener('pointerup', onPointerRelease);
    window.addEventListener('pointercancel', onPointerRelease);

    if (dpadElement) dpadElement.addEventListener('contextmenu', onContextMenu);

    for (const { button, press, release } of bound) {
      button.addEventListener('pointerdown', press);
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('pointerleave', release);
    }
  }

  function detach() {
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
    window.removeEventListener('blur', clear);
    document.removeEventListener('visibilitychange', clear);
    window.removeEventListener('pointerup', onPointerRelease);
    window.removeEventListener('pointercancel', onPointerRelease);

    if (dpadElement) dpadElement.removeEventListener('contextmenu', onContextMenu);

    for (const { button, press, release } of bound) {
      button.removeEventListener('pointerdown', press);
      button.removeEventListener('pointerup', release);
      button.removeEventListener('pointercancel', release);
      button.removeEventListener('pointerleave', release);
    }
    clear();
  }

  return { vector: () => vectorFrom(heldCodes), clear, attach, detach };
}

// The scare sound and the ambient music, both synthesized with the Web Audio API. No audio file and
// no base64 audio blob, so the bundle stays small and the scream is exactly 4 seconds by
// construction rather than by however long a sourced clip happens to run.
//
// Nothing here reads game state or touches the DOM. The title screen is silent, wall contact makes
// no sound, and the music is cut before the scream is scheduled, so the scream still lands into
// silence, which is what makes it land at all.

/** Seconds. Shorter than the image, so the scare always ends in silence rather than in a cut-off. */
const SCREAM_DURATION = 4.0;

/** Master gain ceiling. Startling, not damaging. */
const PEAK_GAIN = 0.45;

/**
 * Master gain ceiling for the ambient music, against the scream's 0.45. It is meant to sit at the
 * edge of hearing and set unease, never to be listened to.
 */
const MUSIC_GAIN = 0.05;

/** Seconds the music takes to ramp away when stopped. An abrupt stop would click. */
const MUSIC_FADE = 0.3;

/** Seconds of white noise generated once per context and reused across plays. */
const NOISE_SECONDS = 4.0;

const noiseBuffers = new WeakMap();

/** White noise, generated once per context. */
function noiseBuffer(ctx) {
  const cached = noiseBuffers.get(ctx);
  if (cached) return cached;

  const length = Math.floor(ctx.sampleRate * NOISE_SECONDS);
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;

  noiseBuffers.set(ctx, buffer);
  return buffer;
}

/**
 * Schedule the four layers of the scream at `startTime`, all at once and with no timers. Returns
 * the scheduled source nodes. Nothing is scheduled before `startTime` and nothing outlives
 * `startTime + SCREAM_DURATION`.
 */
function buildScream(ctx, startTime) {
  const end = startTime + SCREAM_DURATION;

  // A limiter is the last thing before the destination, as a safety net under the master cap.
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.setValueAtTime(-12, startTime);
  limiter.knee.setValueAtTime(6, startTime);
  limiter.ratio.setValueAtTime(12, startTime);
  limiter.attack.setValueAtTime(0.002, startTime);
  limiter.release.setValueAtTime(0.15, startTime);
  limiter.connect(ctx.destination);

  const master = ctx.createGain();
  master.gain.setValueAtTime(PEAK_GAIN, startTime);
  master.connect(limiter);

  const sources = [];

  // Layer 1, impact: a white-noise burst through a lowpass sweeping 8 kHz down to 200 Hz.
  const impact = ctx.createBufferSource();
  impact.buffer = noiseBuffer(ctx);
  const impactFilter = ctx.createBiquadFilter();
  impactFilter.type = 'lowpass';
  impactFilter.frequency.setValueAtTime(8000, startTime);
  impactFilter.frequency.exponentialRampToValueAtTime(200, startTime + 0.25);
  const impactGain = ctx.createGain();
  impactGain.gain.setValueAtTime(0.0001, startTime);
  impactGain.gain.linearRampToValueAtTime(1, startTime + 0.01);
  impactGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.25);
  impact.connect(impactFilter);
  impactFilter.connect(impactGain);
  impactGain.connect(master);
  impact.start(startTime);
  impact.stop(startTime + 0.3);
  sources.push(impact);

  // Layer 2, scream body: two sawtooths detuned about 15 cents, gliding 1200 Hz down to 180 Hz.
  const bodyGain = ctx.createGain();
  bodyGain.gain.setValueAtTime(0.0001, startTime);
  bodyGain.gain.linearRampToValueAtTime(0.8, startTime + 0.02);
  bodyGain.gain.setValueAtTime(0.8, startTime + 2.8);
  bodyGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 3.4);
  bodyGain.connect(master);

  for (const detune of [-15, 15]) {
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.detune.setValueAtTime(detune, startTime);
    osc.frequency.setValueAtTime(1200, startTime);
    osc.frequency.exponentialRampToValueAtTime(180, startTime + 3.4);
    osc.connect(bodyGain);
    osc.start(startTime);
    osc.stop(end);
    sources.push(osc);
  }

  // Layer 3, grit: bandpass-filtered noise tracking the scream's pitch, at a lower gain.
  const grit = ctx.createBufferSource();
  grit.buffer = noiseBuffer(ctx);
  const gritFilter = ctx.createBiquadFilter();
  gritFilter.type = 'bandpass';
  gritFilter.Q.setValueAtTime(1.2, startTime);
  gritFilter.frequency.setValueAtTime(1200, startTime);
  gritFilter.frequency.exponentialRampToValueAtTime(180, startTime + 3.4);
  const gritGain = ctx.createGain();
  gritGain.gain.setValueAtTime(0.0001, startTime);
  gritGain.gain.linearRampToValueAtTime(0.35, startTime + 0.05);
  gritGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 3.4);
  grit.connect(gritFilter);
  gritFilter.connect(gritGain);
  gritGain.connect(master);
  grit.start(startTime);
  grit.stop(end);
  sources.push(grit);

  // Layer 4, sub: a 55 Hz sine for chest weight.
  const sub = ctx.createOscillator();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(55, startTime);
  const subGain = ctx.createGain();
  subGain.gain.setValueAtTime(0.0001, startTime);
  subGain.gain.linearRampToValueAtTime(0.7, startTime + 0.02);
  subGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.2);
  sub.connect(subGain);
  subGain.connect(master);
  sub.start(startTime);
  sub.stop(startTime + 1.3);
  sources.push(sub);

  return sources;
}

/**
 * The ambient drone: two low detuned oscillators through a lowpass, with two slow LFOs moving the
 * filter cutoff and the master music gain so it breathes. Returns `{ nodes, gain }`, where `nodes`
 * are the oscillators, the only things that need stopping.
 *
 * Nothing here schedules a stop and nothing loops, because there is no clip to loop: the oscillators
 * simply run until `stopMusic` ends them, so there is no loop point to hear.
 */
function buildMusic(ctx) {
  const now = ctx.currentTime;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(MUSIC_GAIN * 0.8, now);
  gain.connect(ctx.destination);

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(240, now);
  filter.Q.setValueAtTime(0.8, now);
  filter.connect(gain);

  const nodes = [];

  // Two voices a fifth apart, low in the register and detuned a few cents so they beat slowly
  // against each other rather than sitting still.
  for (const [frequency, detune] of [[55, -6], [82.5, 7]]) {
    const voice = ctx.createOscillator();
    voice.type = 'sawtooth';
    voice.frequency.setValueAtTime(frequency, now);
    voice.detune.setValueAtTime(detune, now);
    voice.connect(filter);
    voice.start(now);
    nodes.push(voice);
  }

  // The filter LFO. Its depth is a cutoff swing in Hz, not a loudness, and it feeds an AudioParam
  // rather than the audio path, so it is not bound by MUSIC_GAIN.
  const filterLfo = ctx.createOscillator();
  filterLfo.type = 'sine';
  filterLfo.frequency.setValueAtTime(0.06, now);
  const filterDepth = ctx.createGain();
  filterDepth.gain.setValueAtTime(120, now);
  filterLfo.connect(filterDepth);
  filterDepth.connect(filter.frequency);
  filterLfo.start(now);
  nodes.push(filterLfo);

  // The gain LFO: the breathing. A fifth of the base level either side of it, so the peak is exactly
  // MUSIC_GAIN and the trough is still audible.
  const gainLfo = ctx.createOscillator();
  gainLfo.type = 'sine';
  gainLfo.frequency.setValueAtTime(0.09, now);
  const gainDepth = ctx.createGain();
  gainDepth.gain.setValueAtTime(MUSIC_GAIN * 0.2, now);
  gainLfo.connect(gainDepth);
  gainDepth.connect(gain.gain);
  gainLfo.start(now);
  nodes.push(gainLfo);

  return { nodes, gain };
}

/**
 * Wrap the scream and the music in a context lifecycle. The constructor is injected so tests can
 * pass a fake or `undefined`; `main.js` passes `window.AudioContext || window.webkitAudioContext`.
 */
function createAudio(AudioContextCtor) {
  let ctx = null;
  let music = null;

  // Browsers block audio started outside a user gesture, so unlock() is called from the START
  // click handler. Calling it again is harmless.
  function unlock() {
    if (!AudioContextCtor) return;
    try {
      if (!ctx) ctx = new AudioContextCtor();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (err) {
      ctx = null;
    }
  }

  // Audio failure never blocks the jumpscare and never throws into the animation loop.
  function playScream() {
    if (!AudioContextCtor) return;
    try {
      unlock();
      if (ctx) buildScream(ctx, ctx.currentTime + 0.01);
    } catch (err) {
      // Swallowed on purpose: the visual scare still runs.
    }
  }

  // Idempotent: the node set lives in this closure and a second call is a no-op, since a second set
  // of voices would simply double the volume.
  function startMusic() {
    if (!AudioContextCtor || music) return;
    try {
      unlock();
      if (ctx) music = buildMusic(ctx);
    } catch (err) {
      // Swallowed on purpose: music must never throw into the animation loop.
      music = null;
    }
  }

  function stopMusic() {
    if (!music) return;

    const stopping = music;
    music = null;

    try {
      const now = ctx.currentTime;
      // Ramped rather than cut, since an abrupt stop clicks. The oscillators end just after the
      // ramp lands, so nothing is still sounding when they do.
      stopping.gain.gain.cancelScheduledValues(now);
      stopping.gain.gain.setValueAtTime(MUSIC_GAIN, now);
      stopping.gain.gain.linearRampToValueAtTime(0.0001, now + MUSIC_FADE);
      for (const node of stopping.nodes) node.stop(now + MUSIC_FADE + 0.05);
    } catch (err) {
      // Swallowed on purpose, as above.
    }
  }

  return { unlock, playScream, startMusic, stopMusic, available: Boolean(AudioContextCtor) };
}

// The fullscreen overlay: the user-supplied image, held perfectly still, with the scream.
//
// The 10-second clock belongs to `game.step`, not to a timer here. The overlay is purely a function
// of `state.phase`, so there is one clock, no drift, and no orphaned timer if something else changes
// phase.

/**
 * Bind the overlay to its elements. `imageSrc` is the build-inlined data URI, assigned immediately
 * rather than on `show()`: a data URI decodes fast but not instantly, and a blank first frame would
 * deflate the scare.
 */
function createJumpscare(overlayEl, imgEl, audio, imageSrc) {
  imgEl.src = imageSrc;

  function show() {
    overlayEl.classList.add('visible');

    // Audio failure never blocks the jumpscare. The image is the payload; the sound is a bonus.
    try {
      audio.playScream();
    } catch (err) {
      // Swallowed on purpose.
    }
  }

  function hide() {
    overlayEl.classList.remove('visible');
  }

  return { show, hide };
}

// The only stateful file: it owns `state`, the animation loop, and the wiring between the pure
// game and its DOM edges. Every other module is either pure or a thin adapter.
//
// There is no pause, no debug key, and no level skip. Anything that lets a tester reach the exit
// without playing is also something a victim can stumble into.








const startButton = document.getElementById('start');
const levelupEl = document.getElementById('levelup');
const canvasEl = document.getElementById('canvas');
const dpadEl = document.getElementById('dpad');
const overlayEl = document.getElementById('jumpscare');

const renderer = createRenderer(canvasEl);
const input = createInput(dpadEl);
const audio = createAudio(window.AudioContext || window.webkitAudioContext);
const jumpscare = createJumpscare(overlayEl, overlayEl.querySelector('img'), audio, JUMPSCARE_SRC);

let state = createGame();
let phaseShown = null;
let lastFrame = 0;

/** A fresh seed per play. `Date.now` is read for the seed only, never for game timing. */
function freshSeed() {
  return (Date.now() ^ (Math.random() * 2 ** 32)) >>> 0;
}

/** Screen visibility is one attribute, and the overlay is a function of the phase and nothing else. */
function showPhase(current) {
  const { phase } = current;
  if (phase === phaseShown) return;

  document.body.dataset.phase = phase;

  // The level the player is about to start, counted from one for the player rather than from zero.
  if (phase === 'levelup') {
    levelupEl.textContent = `LEVEL ${current.levelIndex + 2} OF ${LEVELS.length}`;
  }

  if (phase === 'scare') {
    // The stop comes first and must stay first: `jumpscare.show()` is what schedules the scream,
    // and the scream landing into sudden silence is the contrast the whole app is built around.
    audio.stopMusic();
    jumpscare.show();
  } else {
    jumpscare.hide();
  }

  // Started on entering the maze and left running through `levelup`, so the handover between levels
  // is not punctuated by silence. `startMusic` is idempotent, so coming back from a beat is a no-op.
  if (phase === 'playing') audio.startMusic();
  if (phase === 'title') audio.stopMusic();

  // A key held across a phase change would otherwise leak in as phantom movement.
  if (phase !== 'playing') input.clear();
  if (phase === 'playing') renderer.resize();

  phaseShown = phase;
}

// The audio context has to be built inside the click handler: browsers block audio started outside
// a user gesture, and a silent scare would defeat the whole app. START is the only control the app
// has: it draws one seed and begins the first level, and every later level derives its own.
startButton.addEventListener('click', () => {
  audio.unlock();
  state = pressStart(state, freshSeed());
});

// A mobile browser fires resize continuously while its address bar slides, and each one reallocates
// the canvas backing store, so they are coalesced into one per frame.
let resizeQueued = false;
function queueResize() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    renderer.resize();
  });
}

window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', queueResize);

// One loop in every phase, since `step` also advances the scare clock.
function frame(now) {
  const dt = lastFrame ? (now - lastFrame) / 1000 : 0;
  lastFrame = now;

  state = step(state, dt, input.vector());
  showPhase(state);
  if (state.phase === 'playing') renderer.draw(state, now);

  requestAnimationFrame(frame);
}

input.attach();
renderer.resize();
showPhase(state);
requestAnimationFrame(frame);
    </script>
  </body>
