<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Maze</title>
    <style>__STYLES__</style>
  </head>
  <body data-phase="title">
    <div id="screens">
      <section data-screen="title">
        <p class="warning">WARNING: Not suitable for those sensitive to sudden sounds or visuals.</p>
        <button id="start">START</button>
      </section>
      <section data-screen="select">
        <button data-level="EASY">EASY</button>
        <button data-level="MEDIUM">MEDIUM</button>
        <button data-level="HARD">HARD</button>
      </section>
      <section data-screen="playing">
        <canvas id="canvas"></canvas>
      </section>
    </div>

    <div class="dpad" id="dpad">
      <button class="dpad-up" data-code="dpad-up" aria-label="Move up"></button>
      <button class="dpad-left" data-code="dpad-left" aria-label="Move left"></button>
      <button class="dpad-right" data-code="dpad-right" aria-label="Move right"></button>
      <button class="dpad-down" data-code="dpad-down" aria-label="Move down"></button>
    </div>

    <div class="jumpscare" id="jumpscare"><img alt="" /></div>

    <script type="module">
const JUMPSCARE_SRC = "__ASSET_JUMPSCARE__";
__SCRIPT__
    </script>
  </body>
</html>
